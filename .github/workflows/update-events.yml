name: Uuenda üritused

on:
  schedule:
    - cron: "0 4 * * *"   # iga päev 04:00 UTC (Eestis 06:00 või 07:00)
  workflow_dispatch:       # lubab käivitada ka käsitsi (Actions -> Run workflow)

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kogu üritused
        run: python scripts/fetch_events.py

      - name: Commit, kui midagi muutus
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add events.json events-auto.js
          if git diff --cached --quiet; then
            echo "Muudatusi pole."
          else
            git commit -m "Uuenda üritused $(date -u +%F)"
            git push
          fi
